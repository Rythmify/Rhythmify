name: rythmify
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  dartz: ^0.10.1
  file_picker: ^8.0.0
  image_picker: ^1.1.0
  http: ^1.2.0
  http_parser: ^4.0.2
  mime: ^1.0.5

  # State Management & Dependency Injection
  flutter_riverpod: ^3.2.1
  equatable: ^2.0.8

  # Navigation & Routing
  go_router: ^16.1.0

  # Database
  supabase_flutter: ^2.12.0

  # Audio Engine
  just_audio: ^0.10.5
  audio_service: ^0.18.18

  # UI & Design
  flutter_svg: ^2.2.3
  google_fonts: ^8.0.2
  cached_network_image: ^3.4.1  # or consider "cached_network_image_ce"
  shimmer: ^3.0.0

  # Local Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.11.1
  riverpod_lint: ^3.1.3

flutter:
  # Defining assets location
  uses-material-design: true
  assets:
    - assets/icons/