name: rythmify
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # State Management & Dependency Injection
  flutter_riverpod: ^3.2.1
  equatable: ^2.0.8

  # Profile
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  
# Authentication
  dartz: ^0.10.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  
  # Navigation & Routing
  go_router: ^16.1.0

  # Database
  supabase_flutter: ^2.12.0

  # Audio Engine
  just_audio: ^0.10.5
  audio_service: ^0.18.18

  # UI & Design
  flutter_svg: ^2.2.3
  google_fonts: ^8.0.2
  cached_network_image: ^3.4.1  # or consider "cached_network_image_ce"
  shimmer: ^3.0.0

  # Local Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.11.1
  riverpod_lint: ^3.1.3

flutter:
  # Defining assets location
  uses-material-design: true
  assets:
  - assets/icons/
  - assets/images/



flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
