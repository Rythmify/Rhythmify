workflows:
  ios-build:
    name: iOS IPA Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build with xcodebuild
        script: |
          flutter pub get
          cd ios
          pod install
          cd ..
          
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios/derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
          
          APP_PATH=$(find build/ios/derived -name "Runner.app" -type d | head -1)
          echo "App found at: $APP_PATH"
          
          rm -rf Payload
          mkdir Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -qr Rythmify.ipa Payload
          ls -lh Rythmify.ipa

    artifacts:
      - Rythmify.ipa