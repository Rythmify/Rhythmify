workflows:
  ios-build:
    name: iOS IPA Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Disable code signing
        script: |
          cd ios
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' Runner.xcodeproj/project.pbxproj

      - name: Build IPA (no codesign)
        script: |
          flutter build ios --debug --no-codesign --verbose
          
          echo "=== ALL Runner.app found ==="
          find . -name "Runner.app" -type d 2>/dev/null
          
          echo "=== Contents of build/ios ==="
          ls -la build/ios/ 2>/dev/null || echo "No build/ios"
          ls -la build/ios/iphoneos/ 2>/dev/null || echo "No iphoneos folder"
          
          APP_PATH="build/ios/iphoneos/Runner.app"
          
          echo "=== Info.plist check ==="
          ls "$APP_PATH/Info.plist" || echo "Info.plist NOT FOUND"
          ls "$APP_PATH/" || echo "Runner.app is empty or missing"
          
          rm -rf Payload
          mkdir Payload
          cp -r "$APP_PATH" Payload/Runner.app
          
          echo "=== Final Payload check ==="
          ls Payload/Runner.app/Info.plist
          
          zip -qr Rythmify.ipa Payload
          
          echo "=== IPA created ==="
          ls -lh Rythmify.ipa

    artifacts:
      - Rythmify.ipa