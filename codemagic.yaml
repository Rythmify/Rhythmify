workflows:
  ios-build:
    name: iOS IPA Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build IPA (no codesign)
        script: |
          flutter build ios --debug --no-codesign
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Rythmify.ipa Payload/

    artifacts:
      - build/ios/iphoneos/Rythmify.ipa