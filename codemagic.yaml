workflows:
  ios-build:
    name: iOS IPA Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Disable code signing
        script: |
          cd ios
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' Runner.xcodeproj/project.pbxproj

      - name: Build IPA (no codesign)
        script: |
          flutter build ios --debug --no-codesign
          
          # Find Runner.app
          APP_PATH=$(find build -name "Runner.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          echo "Contents of Runner.app:"
          ls "$APP_PATH"
          
          # Package correctly
          rm -rf Payload
          mkdir Payload
          cp -r "$APP_PATH" Payload/Runner.app
          
          # Verify Info.plist exists before zipping
          echo "Checking Info.plist:"
          ls Payload/Runner.app/Info.plist
          
          zip -qr Rythmify.ipa Payload
          echo "IPA created, size:"
          ls -lh Rythmify.ipa

    artifacts:
      - Rythmify.ipa