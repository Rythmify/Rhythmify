name: Cross-Platform — Main Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  # JOB 1 — Validate repo structure
  validate-structure:
    name: Validate Repo Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cross-platform repo
        uses: actions/checkout@v4

      - name: Check pubspec files exist
        run: |
          test -f pubspec.yaml || { echo "MISSING: pubspec.yaml"; exit 1; }
          test -f pubspec.lock || { echo "MISSING: pubspec.lock"; exit 1; }
          echo "pubspec files present."

      - name: Check analysis options exist
        run: |
          test -f analysis_options.yaml || { echo "MISSING: analysis_options.yaml"; exit 1; }
          echo "analysis_options.yaml present."

      - name: Check main entry point exists
        run: |
          test -f lib/main.dart || { echo "MISSING: lib/main.dart"; exit 1; }
          echo "lib/main.dart present."

      - name: Check core structure exists
        run: |
          test -d lib/core         || { echo "MISSING: lib/core/"; exit 1; }
          test -d lib/features     || { echo "MISSING: lib/features/"; exit 1; }
          test -f lib/core/network/api_client.dart || { echo "MISSING: lib/core/network/api_client.dart"; exit 1; }
          test -f lib/core/routing/app_router.dart || { echo "MISSING: lib/core/routing/app_router.dart"; exit 1; }
          echo "Core structure present."

      - name: Check no hardcoded base URLs in API client
        run: |
          echo "Scanning api_client.dart for hardcoded URLs..."
          if grep -qE "http://[0-9]|https://[a-zA-Z0-9]" lib/core/network/api_client.dart; then
            echo "WARNING: Possible hardcoded URL found in api_client.dart"
            grep -nE "http://[0-9]|https://[a-zA-Z0-9]" lib/core/network/api_client.dart || true
          else
            echo "No hardcoded URLs detected in api_client.dart."
          fi

  # JOB 2 — Flutter analysis and format check
  analyze:
    name: Format Check & Static Analysis
    runs-on: ubuntu-latest
    needs: validate-structure

    steps:
      - name: Checkout cross-platform repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify dependency resolution
        run: |
          flutter pub deps > /dev/null && echo "Dependencies resolved cleanly." || \
            { echo "Dependency resolution failed."; exit 1; }

      - name: Run Dart format check
        run: |
          dart format --output=none --set-exit-if-changed lib/ test/ || \
            { echo "Format check failed — run 'dart format lib/ test/' locally to fix."; exit 1; }

      - name: Run Flutter analyze
        run: flutter analyze --no-fatal-infos

  # JOB 3 — Unit and widget tests
  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Checkout cross-platform repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Install lcov for coverage reporting
        run: sudo apt-get install -y lcov

      - name: Generate coverage summary
        run: |
          lcov --summary coverage/lcov.info 2>&1 | tee coverage/summary.txt
          echo "Coverage summary generated."

      - name: Enforce 95% line coverage threshold
        run: |
          echo "Checking coverage threshold..."
          coverage=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | grep -oP '[0-9]+\.[0-9]+(?=%)' | head -1)
          echo "Current line coverage: ${coverage}%"
          result=$(awk "BEGIN { print (${coverage} >= 95) ? \"pass\" : \"fail\" }")
          if [ "$result" = "fail" ]; then
            echo "Coverage threshold not met — ${coverage}% is below the required 95%."
            echo "Raise test coverage in lib/ before merging to main."
            exit 1
          fi
          echo "Coverage threshold passed — ${coverage}% meets the required 95%."

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage-report
          path: |
            coverage/lcov.info
            coverage/summary.txt
          retention-days: 7

  # JOB 4 — Flutter integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout cross-platform repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter integration tests
        run: flutter test integration_test

  # JOB 5 — Android release build
  build-android:
    name: Android Release Build
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Checkout cross-platform repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Set up Java (required for Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android release APK
        run: flutter build apk --release --no-pub

      - name: Confirm release APK was produced
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk || \
            { echo "Release APK not found — build may have silently failed."; exit 1; }
          echo "Android release APK produced successfully."

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
