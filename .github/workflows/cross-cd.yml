name: Cross-Platform — CD Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for this release (e.g. v1.0.0)"
        required: true

jobs:
  # JOB 1 — Build Android release APK
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cross-platform repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Clean Flutter project
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Confirm APK was produced
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk || \
            { echo "Release APK not found — build may have silently failed."; exit 1; }
          echo "Android release APK produced successfully."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  # JOB 2 — Build Windows executable (must run on windows-latest)
  build-windows-exe:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout cross-platform repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release --no-pub

      - name: Zip Windows release folder
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "rythmify-windows.zip"

      - name: Confirm zip was produced
        run: |
          if (-not (Test-Path "rythmify-windows.zip")) {
            Write-Error "rythmify-windows.zip not found — build may have silently failed."
            exit 1
          }
          Write-Host "Windows release zip produced successfully."

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-zip
          path: rythmify-windows.zip
          retention-days: 1

  # JOB 3 — Create GitHub Release with permanent download URLs
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android-apk, build-windows-exe]

    steps:
      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: android-release-apk

      - name: Download Windows zip artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release-zip
          path: windows-release-zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Rythmify ${{ steps.version.outputs.tag }}"
          body: |
            ## Rythmify ${{ steps.version.outputs.tag }}

            ### Downloads
            - **Android APK** — Install on your Android device
            - **Windows Desktop** — Extract the zip and run `rythmify.exe`

            ### What's New
            See the [changelog](https://github.com/Rythmify/rythmify-cross-platform/blob/main/CHANGELOG.md) for details.
          files: |
            android-release-apk/app-release.apk
            windows-release-zip/rythmify-windows.zip
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, 'beta') || contains(steps.version.outputs.tag, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
